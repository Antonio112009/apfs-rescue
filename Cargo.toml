[package]
name = "apfs-rescue"
version = "0.4.0"
edition = "2024"
description = "Read-only recovery of files from APFS disk images, including Fusion Drives"
license = "MIT"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
filetime = "0.2.29"
flate2 = "1.1.11"
lzfse_rust = "0.2.1"
rayon = "1.12.0"
unicode-normalization = "0.1.26"

[profile.release]
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# `mount` on Linux: the kernel's FUSE.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18.0"
ctrlc = "3.5.2"

# `mount` on macOS: a local NFS server, mounted with the system's mount_nfs.
[target.'cfg(target_os = "macos")'.dependencies]
async-trait = "0.1.92"
nfsserve = "0.11.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
